version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Minor and patch updates rarely break anything, so they share one PR.
    # Majors get one PR each, so one blocked major can't hold back the others.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 10
    allow:
      - dependency-type: direct

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Same grouping as npm: minor and patch together, each major on its own
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'ci: 🎡 '
    open-pull-requests-limit: 10
