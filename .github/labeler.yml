'section: workflows':
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
'section: repo':
  - changed-files:
      - any-glob-to-any-file:
          - '*'
'section: tests':
  - changed-files:
      - any-glob-to-any-file:
          - scripts/checks/**
'context: github':
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
'context: npm':
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
'experience: developer':
  - changed-files:
      - any-glob-to-any-file:
          - .browserslistrc
          - .editorconfig
          - .gitignore
          - .prettierrc
          - eslint.config.js
'📄 article update':
  - changed-files:
      - any-glob-to-any-file:
          - src/assets/posts/**
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '*.md'
              - .github/**/*.md
'mindless: 📦 dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - package-lock.json
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/', '^ci/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
