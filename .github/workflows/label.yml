name: Pull Request Labeler

# Runs from main with the base repository's token, so it never checks out or
# runs code from the pull request
on:
  - pull_request_target

permissions:
  contents: read

jobs:
  labeler:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label the pull request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
