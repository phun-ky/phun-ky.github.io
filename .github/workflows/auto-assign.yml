name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  run:
    # Dependabot's pull_request token is read-only, so it can't assign
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto-assign issue or pull request
        uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
        with:
          assignees: phun-ky
          numOfAssignee: 1
          # GitHub doesn't let a pull request be assigned to its own author,
          # which leaves no one to assign on my own pull requests
          allowNoAssignees: true
