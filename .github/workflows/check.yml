name: Checks

on:
  push:
    branches: ['main']
  # No path filter: `check` is the required check, so it must run on every PR
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint # JavaScript and Markdown
        run: npm run lint
      - name: Check formatting # Templates, CSS, JSON and YAML
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Check fonts # Every shipped font is used
        run: npm run check:fonts
      - name: Check links # Every internal link and asset exists
        run: npm run check:links
      - name: Check trailing slash URLs # `/a/b/` reaches `/a/b`
        run: npm run check:trailing-slash
