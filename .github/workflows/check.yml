name: Check and deploy

on:
  push:
    branches: ['main']
  # No path filter: `check` is the required check, so it must run on every PR
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; runs on main are never
# cancelled, so a deploy always finishes
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # A hung step fails the run instead of holding it for six hours
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check best practices answers # Every linked file and heading exists
        run: npm run check:bestpractices
      - name: Lint # JavaScript and Markdown
        run: npm run lint
      - name: Check formatting # Templates, CSS, JSON and YAML
        run: npm run format:check
      - name: Check posts # No Markdown the renderer shows differently
        run: npm run check:posts
      - name: Build
        run: npm run build
      - name: Check fonts # Every shipped font is used
        run: npm run check:fonts
      - name: Check for source files # No Markdown sources in the site
        run: npm run check:sources
      - name: Check links # Every internal link and asset exists
        run: npm run check:links
      - name: Check trailing slash URLs # `/a/b/` reaches `/a/b`
        run: npm run check:trailing-slash
      - name: Check metadata # Titles, descriptions, Open Graph, canonical URLs, sitemap
        run: npm run check:metadata
      - name: Check the Content Security Policy # One policy per page, matching its inline code
        run: npm run check:csp
      - name: Check every page in a browser # Other hosts, CSP violations, axe (WCAG 2.2 AA)
        run: npm run check:browser
      - name: Check performance budgets # One page per template, on a throttled phone
        run: npm run check:performance
      - name: Take screenshots # One page per template, 3 widths, both themes
        if: ${{ !cancelled() }}
        run: npm run screenshots
      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: error

  deploy:
    # Only main deploys, and only after the checks pass
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No dependency cache in the deploy job, so a poisoned cache can't
      # reach the site
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the deployed site # The live pages match this build
        run: npm run check:live -- "$PAGE_URL"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
